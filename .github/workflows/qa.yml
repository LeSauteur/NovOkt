name: Site QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-qa:
    name: Links, office identity and reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run qa
      - run: npm run build
      - name: Generated pages match committed source
        run: git diff --exit-code
      - run: npm run qa
